<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Sprint</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>Focus Sprint</h1>
      <div class="stats">
        <div class="stat">
          <span class="stat-value" id="streakValue">0</span>
          <span class="stat-label">🔥 streak</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="todayValue">0</span>
          <span class="stat-label">today</span>
        </div>
      </div>
    </header>

    <div class="modes">
      <button class="mode-btn active" data-mode="focus">Focus</button>
      <button class="mode-btn" data-mode="short">Short Break</button>
      <button class="mode-btn" data-mode="long">Long Break</button>
    </div>

    <div class="timer-ring">
      <svg viewBox="0 0 200 200" class="ring-svg">
        <circle class="ring-bg" cx="100" cy="100" r="90"></circle>
        <circle class="ring-progress" id="ringProgress" cx="100" cy="100" r="90"></circle>
      </svg>
      <div class="timer-display">
        <span id="timeLabel">25:00</span>
        <span class="timer-sub" id="modeLabel">Focus sprint</span>
      </div>
    </div>

    <div class="controls">
      <button id="startPauseBtn" class="primary-btn">Start</button>
      <button id="resetBtn" class="secondary-btn">Reset</button>
    </div>

    <details class="settings">
      <summary>Settings</summary>
      <div class="settings-grid">
        <label>Focus (min) <input type="number" id="focusMin" min="1" max="120" value="25"></label>
        <label>Short break (min) <input type="number" id="shortMin" min="1" max="60" value="5"></label>
        <label>Long break (min) <input type="number" id="longMin" min="1" max="90" value="15"></label>
        <label>Sprints per long break <input type="number" id="cycleCount" min="1" max="12" value="4"></label>
      </div>
    </details>

    <div class="log-section">
      <div class="log-header">
        <h2>Sprint Log</h2>
        <button id="clearLogBtn" class="text-btn">Clear</button>
      </div>
      <ul id="logList" class="log-list"></ul>
      <p id="emptyLog" class="empty-log">No sprints logged yet. Finish a focus sprint to add your first entry.</p>
    </div>
  </div>

  <div class="modal-overlay" id="noteModal">
    <div class="modal">
      <h3>Sprint complete 🎉</h3>
      <p>What did you work on?</p>
      <input type="text" id="noteInput" placeholder="e.g. Drafted the intro section" maxlength="140" autocomplete="off">
      <div class="modal-actions">
        <button id="skipNoteBtn" class="secondary-btn">Skip</button>
        <button id="saveNoteBtn" class="primary-btn">Save</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
